<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hollowmark — voxel prototype</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #08080d; overflow: hidden; }
      #app { width: 100%; height: 100%; }
      canvas { display: block; }
      * { font-family: monospace; }

      #hud {
        position: fixed; top: 12px; left: 14px; z-index: 10;
        color: #d8c8a0; font-size: 13px; letter-spacing: 1px;
        text-shadow: 0 0 8px #000; pointer-events: none; line-height: 1.5;
      }
      #hud b { color: #e8d8a8; letter-spacing: 3px; }
      #hud .dim { color: #7a7a86; }

      /* --- bottom HUD --- */
      #hudbar {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
        display: flex; align-items: flex-end; justify-content: center; gap: 22px;
        padding: 0 18px 14px; pointer-events: none;
      }
      .orb {
        position: relative; width: 84px; height: 84px; border-radius: 50%;
        border: 2px solid #2a2a36; background: #0c0c14; overflow: hidden;
        box-shadow: 0 0 16px #000a, inset 0 0 12px #000a;
      }
      .orb .fill { position: absolute; left: 0; right: 0; bottom: 0; height: 100%; transition: height 0.12s linear; }
      .orb.hp .fill { background: linear-gradient(#e0483a, #8a1e18); }
      .orb.mana .fill { background: linear-gradient(#4a7ad8, #1e2e8a); }
      .orb .num {
        position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        color: #fff; font-size: 15px; font-weight: bold; text-shadow: 0 0 5px #000, 0 1px 2px #000;
      }
      #center { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-bottom: 6px; }
      #meta { color: #d8c8a0; font-size: 13px; letter-spacing: 1px; text-shadow: 0 0 6px #000; }
      #meta .gold { color: #e8c85a; }
      #meta .lvl { color: #cfe0ff; }
      #xpwrap { width: 260px; height: 5px; background: #14141c; border: 1px solid #2a2a36; border-radius: 3px; overflow: hidden; }
      #xpfill { height: 100%; width: 0%; background: linear-gradient(#c9a44a, #8a6a2a); transition: width 0.2s linear; }
      #hotbar { display: flex; gap: 7px; margin-top: 2px; }
      .slot {
        width: 40px; height: 40px; border: 1.5px solid #3a3242; border-radius: 5px;
        background: #14121c; display: flex; flex-direction: column; align-items: center; justify-content: center;
        color: #c8c8d4; font-size: 10px; line-height: 1.2;
      }
      .slot .key { color: #d8b13a; font-weight: bold; font-size: 11px; }
      .slot .sub { color: #8a8a96; font-size: 9px; }
      .slot.pot .key { color: #e0483a; }
      .slot.mpot .key { color: #4a7ad8; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <b>HOLLOWMARK</b> <span class="dim">· voxel</span><br />
      <span id="status" class="dim">connecting…</span><br />
      <span class="dim">L-click move / loot / talk · R-click fight · Q E F skills · R/W potions · T portal · wheel zoom</span>
    </div>
    <div id="hudbar">
      <div class="orb hp"><div class="fill" id="hpfill"></div><div class="num" id="hpnum">—</div></div>
      <div id="center">
        <div id="meta"><span class="lvl" id="lvl">Lv 1</span> · <span class="gold" id="gold">0g</span></div>
        <div id="xpwrap"><div id="xpfill"></div></div>
        <div id="hotbar">
          <div class="slot"><span class="key">Q</span><span class="sub">skill</span></div>
          <div class="slot"><span class="key">E</span><span class="sub">skill</span></div>
          <div class="slot"><span class="key">F</span><span class="sub">skill</span></div>
          <div class="slot pot"><span class="key">R</span><span class="sub" id="pots">0</span></div>
          <div class="slot mpot"><span class="key">W</span><span class="sub" id="mpots">0</span></div>
        </div>
      </div>
      <div class="orb mana"><div class="fill" id="manafill"></div><div class="num" id="mananum">—</div></div>
    </div>
    <script type="module" src="/src/voxel/main.ts"></script>
  </body>
</html>
